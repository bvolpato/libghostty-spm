name: Host IO native proof (fork only)

on:
  push:
    branches: [bvolpato/host-io-native-proof-20261111]

permissions:
  contents: read

concurrency:
  group: host-io-native-proof
  cancel-in-progress: false

defaults:
  run:
    shell: bash
    working-directory: source

jobs:
  legacy-interop:
    if: github.repository == 'bvolpato/libghostty-spm'
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - name: Check out the isolated baseline repair
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: bvolpato/libghostty-spm
          ref: c55af45af39161f46edc0606c8ebe46ebe645240
          path: source
          persist-credentials: false
      - name: Check out fork-only validation fixtures
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          path: proof
          persist-credentials: false
      - name: Select and record Xcode
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_27.1.app ]; then
            sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer
          elif [ -d /Applications/Xcode_27.1.0.app ]; then
            sudo xcode-select -s /Applications/Xcode_27.1.0.app/Contents/Developer
          else
            echo 'Xcode 27.1 is required for this validation' >&2
            exit 1
          fi
          proof_xcode_version=$(xcodebuild -version)
          test "${proof_xcode_version%%$'\n'*}" = 'Xcode 27.1'
          {
            git rev-parse HEAD
            xcodebuild -version
            xcodebuild -showsdks
            swift --version
          } | tee "$RUNNER_TEMP/legacy-toolchain.txt"
          test "$(git rev-parse HEAD)" = c55af45af39161f46edc0606c8ebe46ebe645240
      - name: Exercise actual callbacks against the published legacy header
        run: |
          set -euo pipefail
          ./Script/check-licenses.sh
          cp ../proof/.github/native-proof/HostIOHeaderInteropTests.swift Tests/GhosttyKitTest/Session/
          cp ../proof/.github/native-proof/HostIOLegacyNilBufferTests.swift Tests/GhosttyKitTest/Session/
          swift test --filter HostIOHeaderInteropTests 2>&1 | tee "$RUNNER_TEMP/legacy-interop.log"
      - name: Upload legacy runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: host-io-legacy-interop-c55af45
          path: |
            ${{ runner.temp }}/legacy-toolchain.txt
            ${{ runner.temp }}/legacy-interop.log
          if-no-files-found: error
          retention-days: 7

  paired-native:
    needs: legacy-interop
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - name: Check out immutable notices and baseline repair
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: bvolpato/libghostty-spm
          ref: f1c8bbe85d35d55f214a215dd963b30ae244cf9a
          path: source
          persist-credentials: false
      - name: Check out fork-only validation fixtures
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          path: proof
          persist-credentials: false
      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.17.0
      - name: Select Xcode and install the Metal compiler if required
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_27.1.app ]; then
            sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer
          elif [ -d /Applications/Xcode_27.1.0.app ]; then
            sudo xcode-select -s /Applications/Xcode_27.1.0.app/Contents/Developer
          else
            echo 'Xcode 27.1 is required for this validation' >&2
            exit 1
          fi
          proof_xcode_version=$(xcodebuild -version)
          test "${proof_xcode_version%%$'\n'*}" = 'Xcode 27.1'
          if ! xcrun --sdk macosx metal -v; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun --sdk macosx metal -v
          {
            git rev-parse HEAD
            xcodebuild -version
            xcodebuild -showsdks
            swift --version
            zig version
          } | tee "$RUNNER_TEMP/paired-toolchain.txt"
          test "$(git rev-parse HEAD)" = f1c8bbe85d35d55f214a215dd963b30ae244cf9a
      - name: Clone the immutable Ghostty source
        run: |
          set -euo pipefail
          ghostty_ref=$(tr -d '[:space:]' < Ghostty.ref)
          [[ "$ghostty_ref" =~ ^[0-9a-f]{40}$ ]]
          git clone https://github.com/ghostty-org/ghostty References/ghostty-upstream
          git -C References/ghostty-upstream checkout --detach "$ghostty_ref"
          test "$(git -C References/ghostty-upstream rev-parse HEAD)" = "$ghostty_ref"
      - name: Build and verify a representative macOS arm64 archive
        run: |
          set -euo pipefail
          ./Script/check-licenses.sh
          ./Script/test-source-notices.sh "$PWD/References/ghostty-upstream"
          ./Script/build-ghostty.sh "$PWD/References/ghostty-upstream" aarch64-macos "$PWD/build/out" 2>&1 | tee "$RUNNER_TEMP/paired-native-build.log"
          ./Script/stage-source-notices.sh --check "$PWD/build/out/include/Licenses"
          ./Script/stage-source-notices.sh --verify-source "$PWD/References/ghostty-upstream" "$PWD/build/out/include/Licenses"
          test "$(lipo -archs build/out/lib/libghostty.a)" = arm64
          nm -g -U build/out/lib/libghostty.a > "$RUNNER_TEMP/paired-symbols.txt"
          if grep 'libintl_' "$RUNNER_TEMP/paired-symbols.txt"; then
            echo 'GNU libintl symbols are forbidden in this static library' >&2
            exit 1
          fi
          tar -czf "$RUNNER_TEMP/paired-macos-arm64.tar.gz" -C build/out .
          shasum -a 256 "$RUNNER_TEMP/paired-macos-arm64.tar.gz" > "$RUNNER_TEMP/paired-SHA256SUMS"
      - name: Check current C and Swift nullability imports
        run: |
          set -euo pipefail
          xcrun clang -std=c11 -Wall -Wextra -Werror -Wnullability-completeness -Wnullable-to-nonnull-conversion -fsyntax-only -I build/out/include/libghostty ../proof/.github/native-proof/header-nullability.c
          xcrun swiftc -typecheck -warnings-as-errors -I build/out/include/libghostty ../proof/.github/native-proof/HeaderImport.swift
      - name: Exercise actual callbacks with the fresh header
        run: |
          set -euo pipefail
          mkdir -p BinaryTarget
          xcodebuild -create-xcframework -library "$PWD/build/out/lib/libghostty.a" -headers "$PWD/build/out/include" -output "$PWD/BinaryTarget/GhosttyKit.xcframework"
          cp Package.local.swift Package.swift
          cp ../proof/.github/native-proof/HostIOHeaderInteropTests.swift Tests/GhosttyKitTest/Session/
          swift test --filter HostIOHeaderInteropTests 2>&1 | tee "$RUNNER_TEMP/current-interop.log"
      - name: Upload representative native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: host-io-paired-macos-arm64-f1c8bbe
          path: |
            ${{ runner.temp }}/paired-toolchain.txt
            ${{ runner.temp }}/paired-native-build.log
            ${{ runner.temp }}/current-interop.log
            ${{ runner.temp }}/paired-macos-arm64.tar.gz
            ${{ runner.temp }}/paired-SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
