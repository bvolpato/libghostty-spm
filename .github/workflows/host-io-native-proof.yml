name: Audited header runtime proof (fork only)

on:
  push:
    branches: [bvolpato/host-io-native-proof-20261111]

permissions:
  contents: read
  actions: read

concurrency:
  group: host-io-native-proof
  cancel-in-progress: false

defaults:
  run:
    shell: bash
    working-directory: source

jobs:
  legacy-interop:
    if: github.repository == 'bvolpato/libghostty-spm'
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - name: Check out immutable nullability compatibility source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: bvolpato/libghostty-spm
          ref: 112d8362906e2929f3d5105ccbb68c1bd2188d63
          path: source
          persist-credentials: false
      - name: Check out fork-only validation fixtures
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          path: proof
          persist-credentials: false
      - name: Select and record Xcode
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_27.1.app ]; then
            sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer
          elif [ -d /Applications/Xcode_27.1.0.app ]; then
            sudo xcode-select -s /Applications/Xcode_27.1.0.app/Contents/Developer
          else
            echo 'Xcode 27.1 is required for this validation' >&2
            exit 1
          fi
          proof_xcode_version=$(xcodebuild -version)
          test "${proof_xcode_version%%$'\n'*}" = 'Xcode 27.1'
          {
            git rev-parse HEAD
            xcodebuild -version
            xcodebuild -showsdks
            swift --version
          } | tee "$RUNNER_TEMP/legacy-toolchain.txt"
          test "$(git rev-parse HEAD)" = 112d8362906e2929f3d5105ccbb68c1bd2188d63
      - name: Exercise actual classes against the published legacy binary
        run: |
          set -euo pipefail
          ./Script/check-licenses.sh
          cp ../proof/.github/native-proof/HostIOHeaderInteropTests.swift Tests/GhosttyKitTest/Session/
          cp ../proof/.github/native-proof/HostIOLegacyNilBufferTests.swift Tests/GhosttyKitTest/Session/
          cp ../proof/.github/native-proof/AuditedHeaderInteropTests.swift Tests/GhosttyKitTest/Session/
          swift test --filter 'HostIOHeaderInteropTests|AuditedHeaderInteropTests|TerminalClipboardCompletionPayloadTests|TerminalSearchDelegateTests|TerminalOpenURLDelegateTests' 2>&1 | tee "$RUNNER_TEMP/legacy-interop.log"
      - name: Upload legacy runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: audited-header-legacy-112d836
          path: |
            ${{ runner.temp }}/legacy-toolchain.txt
            ${{ runner.temp }}/legacy-interop.log
          if-no-files-found: error
          retention-days: 7

  current-interop:
    needs: legacy-interop
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - name: Check out immutable combined consumer source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: bvolpato/libghostty-spm
          ref: 60b77a301bf269f994156360da05364f3c757f87
          path: source
          persist-credentials: false
      - name: Check out fork-only validation fixtures
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          path: proof
          persist-credentials: false
      - name: Select and record Xcode
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_27.1.app ]; then
            sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer
          elif [ -d /Applications/Xcode_27.1.0.app ]; then
            sudo xcode-select -s /Applications/Xcode_27.1.0.app/Contents/Developer
          else
            echo 'Xcode 27.1 is required for this validation' >&2
            exit 1
          fi
          proof_xcode_version=$(xcodebuild -version)
          test "${proof_xcode_version%%$'\n'*}" = 'Xcode 27.1'
          {
            git rev-parse HEAD
            xcodebuild -version
            xcodebuild -showsdks
            swift --version
          } | tee "$RUNNER_TEMP/current-consumer-toolchain.txt"
          test "$(git rev-parse HEAD)" = 60b77a301bf269f994156360da05364f3c757f87
      - name: Verify the immutable C-build stage succeeded
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/bvolpato/libghostty-spm/actions/jobs/130635407530 > "$RUNNER_TEMP/native-c-job-proof.json"
          jq -e '
            .id==130635407530 and .run_id==43052624696 and
            .head_sha=="4b8f7904c1556cd540dde10cb8683cad7a8358ec" and
            .conclusion=="failure" and
            any(.steps[]; .name=="Build and verify a representative macOS arm64 archive" and .conclusion=="success") and
            any(.steps[]; .name=="Check current C and Swift nullability imports" and .conclusion=="success")
          ' "$RUNNER_TEMP/native-c-job-proof.json"
      - name: Download the exact previously verified native C artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ github.token }}
          repository: bvolpato/libghostty-spm
          run-id: 43052624696
          name: host-io-paired-macos-arm64-f1c8bbe
          path: native-proof
      - name: Verify original C artifact and notice provenance
        run: |
          set -euo pipefail
          printf '%s  %s\n' dec658701d5d05c6129cf2aa0e4bc62f160972352d6d0d781a44476ff3579b6a ../native-proof/paired-macos-arm64.tar.gz | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/native-out"
          tar -xzf ../native-proof/paired-macos-arm64.tar.gz -C "$RUNNER_TEMP/native-out"
          ./Script/stage-source-notices.sh --check "$RUNNER_TEMP/native-out/include/Licenses"
          jq -e '
            any(.components[]; .name=="ghostty" and .revision=="cf5519b22f910ddc7885d2ef62deb94d38d43f22") and
            any(.components[]; .name=="libghostty-spm" and .revision=="f1c8bbe85d35d55f214a215dd963b30ae244cf9a")
          ' "$RUNNER_TEMP/native-out/include/Licenses/manifest.json"
          test "$(lipo -archs "$RUNNER_TEMP/native-out/lib/libghostty.a")" = arm64
          nm -g -U "$RUNNER_TEMP/native-out/lib/libghostty.a" > "$RUNNER_TEMP/native-symbols.txt"
          if grep 'libintl_' "$RUNNER_TEMP/native-symbols.txt"; then
            echo 'GNU libintl symbols are forbidden in this static library' >&2
            exit 1
          fi
          cp ../native-proof/paired-toolchain.txt "$RUNNER_TEMP/native-c-toolchain.txt"
          cp "$RUNNER_TEMP/native-out/include/Licenses/manifest.json" "$RUNNER_TEMP/native-c-notice-manifest.json"
      - name: Exercise actual classes with the verified current C archive
        run: |
          set -euo pipefail
          ./Script/check-licenses.sh
          mkdir -p BinaryTarget
          xcodebuild -create-xcframework -library "$RUNNER_TEMP/native-out/lib/libghostty.a" -headers "$RUNNER_TEMP/native-out/include" -output "$PWD/BinaryTarget/GhosttyKit.xcframework"
          cp Package.local.swift Package.swift
          cp ../proof/.github/native-proof/HostIOHeaderInteropTests.swift Tests/GhosttyKitTest/Session/
          cp ../proof/.github/native-proof/AuditedHeaderInteropTests.swift Tests/GhosttyKitTest/Session/
          swift test --filter 'HostIOHeaderInteropTests|AuditedHeaderInteropTests|TerminalClipboardCompletionPayloadTests|TerminalSearchDelegateTests|TerminalOpenURLDelegateTests' 2>&1 | tee "$RUNNER_TEMP/current-interop.log"
      - name: Upload current runtime and immutable C-source evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: audited-header-current-60b77a3-native-f1c8bbe
          path: |
            ${{ runner.temp }}/current-consumer-toolchain.txt
            ${{ runner.temp }}/current-interop.log
            ${{ runner.temp }}/native-c-job-proof.json
            ${{ runner.temp }}/native-c-toolchain.txt
            ${{ runner.temp }}/native-c-notice-manifest.json
          if-no-files-found: error
          retention-days: 7
